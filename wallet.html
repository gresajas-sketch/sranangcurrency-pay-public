<!DOCTYPE html>
<html lang="nl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sranangcurrency Pay</title>
<style>
body{margin:0;background:#062b20;color:white;font-family:Arial;text-align:center}
main{max-width:440px;margin:auto;padding:22px}
h1,h2{color:#e9c66e}
.logo{margin:30px auto;width:125px;height:125px;border:5px solid gold;border-radius:50%;display:grid;place-items:center;font-size:70px;color:gold}
.card{background:#14503b;padding:20px;border-radius:18px;margin:16px 0;border:1px solid #d9b65a}
button{background:#d9b65a;color:#092b20;padding:13px;border:0;border-radius:12px;margin:5px;font-weight:bold}
.row{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #ffffff30}
small{color:#c1d4c7}
</style></head>
<body><main>
<h1>Sranangcurrency Pay</h1>
<div class="logo">S</div><h2>STRONGER TOGETHER</h2>
<small>WALLET DEMO — GEEN ECHT GELD</small>
<div class="card"><small>Voorbeeldsaldo</small><h1 id="balance">€ 87,50</h1><p>1.250 SRA</p></div>
<div>
<button onclick="action('Versturen')">Versturen</button>
<button onclick="action('Ontvangen')">Ontvangen</button>
<button onclick="action('QR betalen')">QR betalen</button>
<button onclick="action('Swap')">Swap</button>
</div>
<div class="card"><h2>Cryptomunten</h2><div id="coins"></div></div>
<button onclick="action('Koersen')">Koersen</button>
<button onclick="action('Instellingen')">Instellingen</button>
</main>
<script>
const coins=['SRA','SOL','BTC','ETH','USDT','USDC','BNB','XRP','DOGE'];
document.getElementById('coins').innerHTML=coins.map(x=>'<div class="row"><b>'+x+'</b><span>Demo</span></div>').join('');
function action(name){alert(name+': dit is een demonstratie. Er wordt geen echte betaling uitgevoerd.')}
let t=0;setInterval(()=>{t++;document.getElementById('balance').textContent='€ '+(87.5+Math.sin(t/4)*1.5).toFixed(2).replace('.',',')},2500);
</script></body></html>
